<svg width="1600" height="1200" viewBox="0 0 1600 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#102a43"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#13233d"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1200" fill="url(#bg)"/>
  <text x="40" y="52" fill="#f8fafc" font-size="30" font-family="Segoe UI, Microsoft YaHei">MAS V1 数据库关系图</text>
  <text x="40" y="84" fill="#93c5fd" font-size="16" font-family="Segoe UI, Microsoft YaHei">多角度测色仪上位机系统核心数据实体与关系示意</text>

  <g font-family="Segoe UI, Microsoft YaHei">
    <rect x="60" y="130" width="240" height="120" rx="16" fill="url(#card)" stroke="#38bdf8"/>
    <text x="84" y="164" fill="#ffffff" font-size="22">users</text>
    <text x="84" y="196" fill="#cbd5e1" font-size="14">id / user_code / user_name</text>
    <text x="84" y="220" fill="#cbd5e1" font-size="14">role_code / is_active</text>

    <rect x="360" y="130" width="260" height="146" rx="16" fill="url(#card)" stroke="#38bdf8"/>
    <text x="384" y="164" fill="#ffffff" font-size="22">instruments</text>
    <text x="384" y="196" fill="#cbd5e1" font-size="14">id / instrument_code / model</text>
    <text x="384" y="220" fill="#cbd5e1" font-size="14">serial_number / connection_type</text>
    <text x="384" y="244" fill="#cbd5e1" font-size="14">status / last_connected_at</text>

    <rect x="700" y="130" width="280" height="136" rx="16" fill="url(#card)" stroke="#38bdf8"/>
    <text x="724" y="164" fill="#ffffff" font-size="22">calibration_records</text>
    <text x="724" y="196" fill="#cbd5e1" font-size="14">id / instrument_id / operator_id</text>
    <text x="724" y="220" fill="#cbd5e1" font-size="14">calibration_type / result_code</text>
    <text x="724" y="244" fill="#cbd5e1" font-size="14">started_at / finished_at</text>

    <rect x="60" y="340" width="260" height="126" rx="16" fill="url(#card)" stroke="#34d399"/>
    <text x="84" y="374" fill="#ffffff" font-size="22">color_libraries</text>
    <text x="84" y="406" fill="#cbd5e1" font-size="14">id / library_code / library_name</text>
    <text x="84" y="430" fill="#cbd5e1" font-size="14">category_name / is_default</text>

    <rect x="380" y="330" width="300" height="156" rx="16" fill="url(#card)" stroke="#34d399"/>
    <text x="404" y="364" fill="#ffffff" font-size="22">standard_samples</text>
    <text x="404" y="396" fill="#cbd5e1" font-size="14">id / library_id / standard_code</text>
    <text x="404" y="420" fill="#cbd5e1" font-size="14">version_no / material_name</text>
    <text x="404" y="444" fill="#cbd5e1" font-size="14">tolerance_template_id / is_active</text>

    <rect x="740" y="340" width="290" height="146" rx="16" fill="url(#card)" stroke="#34d399"/>
    <text x="764" y="374" fill="#ffffff" font-size="22">samples</text>
    <text x="764" y="406" fill="#cbd5e1" font-size="14">id / sample_code / sample_name</text>
    <text x="764" y="430" fill="#cbd5e1" font-size="14">batch_no / material_name / status</text>

    <rect x="1090" y="330" width="320" height="166" rx="16" fill="url(#card)" stroke="#34d399"/>
    <text x="1114" y="364" fill="#ffffff" font-size="22">tolerance_templates</text>
    <text x="1114" y="396" fill="#cbd5e1" font-size="14">id / template_code / template_name</text>
    <text x="1114" y="420" fill="#cbd5e1" font-size="14">delta_e_formula / overall_upper_limit</text>
    <text x="1114" y="444" fill="#cbd5e1" font-size="14">effect_upper_limit / is_default</text>

    <rect x="1090" y="540" width="320" height="166" rx="16" fill="url(#card)" stroke="#34d399"/>
    <text x="1114" y="574" fill="#ffffff" font-size="22">tolerance_angle_rules</text>
    <text x="1114" y="606" fill="#cbd5e1" font-size="14">id / template_id / angle_code</text>
    <text x="1114" y="630" fill="#cbd5e1" font-size="14">metric_code / lower_limit / upper_limit</text>
    <text x="1114" y="654" fill="#cbd5e1" font-size="14">warning_upper_limit / is_enabled</text>

    <rect x="360" y="580" width="350" height="176" rx="16" fill="url(#card)" stroke="#f59e0b"/>
    <text x="384" y="614" fill="#ffffff" font-size="22">measurement_tasks</text>
    <text x="384" y="646" fill="#cbd5e1" font-size="14">id / task_code / instrument_id</text>
    <text x="384" y="670" fill="#cbd5e1" font-size="14">sample_id / standard_sample_id / template_id</text>
    <text x="384" y="694" fill="#cbd5e1" font-size="14">task_type / measurement_mode / status</text>
    <text x="384" y="718" fill="#cbd5e1" font-size="14">created_by / started_at / finished_at</text>

    <rect x="760" y="590" width="330" height="156" rx="16" fill="url(#card)" stroke="#f59e0b"/>
    <text x="784" y="624" fill="#ffffff" font-size="22">measurement_records</text>
    <text x="784" y="656" fill="#cbd5e1" font-size="14">id / task_id / record_no / record_type</text>
    <text x="784" y="680" fill="#cbd5e1" font-size="14">total_delta_e / total_effect_diff</text>
    <text x="784" y="704" fill="#cbd5e1" font-size="14">pass_status / measured_at</text>

    <rect x="240" y="840" width="350" height="186" rx="16" fill="url(#card)" stroke="#f59e0b"/>
    <text x="264" y="874" fill="#ffffff" font-size="22">measurement_angle_results</text>
    <text x="264" y="906" fill="#cbd5e1" font-size="14">id / record_id / angle_code</text>
    <text x="264" y="930" fill="#cbd5e1" font-size="14">cie_l / cie_a / cie_b / cie_c / cie_h</text>
    <text x="264" y="954" fill="#cbd5e1" font-size="14">delta_l / delta_a / delta_b / delta_c</text>
    <text x="264" y="978" fill="#cbd5e1" font-size="14">delta_h / delta_e / pass_status</text>

    <rect x="640" y="840" width="320" height="166" rx="16" fill="url(#card)" stroke="#f59e0b"/>
    <text x="664" y="874" fill="#ffffff" font-size="22">measurement_effect_results</text>
    <text x="664" y="906" fill="#cbd5e1" font-size="14">id / record_id / angle_code</text>
    <text x="664" y="930" fill="#cbd5e1" font-size="14">sparkle_value / sparkle_diff</text>
    <text x="664" y="954" fill="#cbd5e1" font-size="14">graininess_value / graininess_diff</text>
    <text x="664" y="978" fill="#cbd5e1" font-size="14">effect_pass_status</text>

    <rect x="1010" y="830" width="300" height="146" rx="16" fill="url(#card)" stroke="#a78bfa"/>
    <text x="1034" y="864" fill="#ffffff" font-size="22">report_exports</text>
    <text x="1034" y="896" fill="#cbd5e1" font-size="14">id / record_id / report_code</text>
    <text x="1034" y="920" fill="#cbd5e1" font-size="14">file_format / file_path</text>
    <text x="1034" y="944" fill="#cbd5e1" font-size="14">exported_at / export_status</text>

    <rect x="1320" y="820" width="220" height="136" rx="16" fill="url(#card)" stroke="#a78bfa"/>
    <text x="1344" y="854" fill="#ffffff" font-size="22">operation_logs</text>
    <text x="1344" y="886" fill="#cbd5e1" font-size="14">id / task_id / record_id</text>
    <text x="1344" y="910" fill="#cbd5e1" font-size="14">module_name / operation_type</text>
    <text x="1344" y="934" fill="#cbd5e1" font-size="14">created_at</text>

    <rect x="1320" y="1000" width="220" height="136" rx="16" fill="url(#card)" stroke="#a78bfa"/>
    <text x="1344" y="1034" fill="#ffffff" font-size="22">raw_packets</text>
    <text x="1344" y="1066" fill="#cbd5e1" font-size="14">id / task_id / instrument_id</text>
    <text x="1344" y="1090" fill="#cbd5e1" font-size="14">direction / packet_type</text>
    <text x="1344" y="1114" fill="#cbd5e1" font-size="14">packet_hex / created_at</text>
  </g>

  <g stroke-width="3" fill="none">
    <line x1="300" y1="190" x2="360" y2="190" stroke="#38bdf8"/>
    <line x1="620" y1="200" x2="700" y2="200" stroke="#38bdf8"/>
    <line x1="240" y1="250" x2="240" y2="340" stroke="#34d399"/>
    <line x1="320" y1="400" x2="380" y2="400" stroke="#34d399"/>
    <line x1="680" y1="410" x2="740" y2="410" stroke="#34d399"/>
    <line x1="1030" y1="410" x2="1090" y2="410" stroke="#34d399"/>
    <line x1="1250" y1="496" x2="1250" y2="540" stroke="#34d399"/>
    <line x1="620" y1="276" x2="620" y2="580" stroke="#f59e0b"/>
    <line x1="890" y1="486" x2="890" y2="590" stroke="#f59e0b"/>
    <line x1="535" y1="756" x2="535" y2="840" stroke="#f59e0b"/>
    <line x1="925" y1="746" x2="925" y2="840" stroke="#f59e0b"/>
    <line x1="1090" y1="668" x2="1090" y2="830" stroke="#a78bfa"/>
    <line x1="1090" y1="668" x2="1430" y2="820" stroke="#a78bfa"/>
    <line x1="710" y1="668" x2="760" y2="668" stroke="#f59e0b"/>
  </g>
</svg>
